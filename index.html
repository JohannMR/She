<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti...</title>
    <style>
        /* Estilos generales y fondo rosadito inicial */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
            background-color: #ffe6f2; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
            transition: background-color 2s ease;
        }

        /* Capa del paisaje animado (inicialmente invisible) */
        #bg-animado {
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            /* Paisaje hermoso de campo de flores */
            background: url('https://images.unsplash.com/photo-1587314545366-22f2b3e8ce7b?q=80&w=2070&auto=format&fit=crop') no-repeat center center/cover;
            opacity: 0;
            z-index: 1;
            transition: opacity 2.5s ease-in-out;
            transform: scale(1.2);
        }

        /* Animación para que el paisaje se mueva como un video */
        .mostrar-paisaje #bg-animado {
            opacity: 1;
            animation: efectoVideo 25s infinite alternate ease-in-out;
        }

        @keyframes efectoVideo {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.15) translate(-30px, 15px); }
        }

        /* Creación de los destellos doraditos iniciales */
        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: gold;
            border-radius: 50%;
            box-shadow: 0 0 10px gold, 0 0 20px #ffea00;
            animation: twinkle 3s infinite ease-in-out alternate;
            z-index: 2;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.5) translateY(0); }
            100% { opacity: 1; transform: scale(1.5) translateY(-20px); }
        }

        /* Animación de las flores (Peonías y Tulipanes) brotando */
        .flor-animada {
            position: absolute;
            bottom: -50px;
            font-size: 2.5rem;
            z-index: 3;
            animation: flotarArriba linear forwards;
            opacity: 0.9;
            filter: drop-shadow(0px 0px 5px rgba(255,255,255,0.5));
        }

        @keyframes flotarArriba {
            0% { transform: translateY(0) rotate(-15deg) scale(0.5); opacity: 0; }
            10% { opacity: 1; transform: scale(1.1); }
            100% { transform: translateY(-110vh) rotate(20deg) scale(1.5); opacity: 0; }
        }

        /* Contenedor central de los botones y el mensaje */
        .container {
            text-align: center;
            z-index: 10;
            background: rgba(255, 255, 255, 0.7);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.3);
            transition: all 1.5s ease;
            position: relative;
        }

        /* Estilo de los botones */
        button {
            background-color: #ff66b2;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 20px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.5);
            transition: background 0.3s, transform 0.2s;
        }

        button:hover {
            background-color: #ff3399;
            transform: scale(1.05);
        }

        #btn2 {
            display: none;
        }

        /* Estilo del mensaje romántico final */
        #mensajeFinal {
            display: none;
            font-size: 26px;
            color: #ffffff;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.9);
            max-width: 700px;
            line-height: 1.6;
            background: rgba(0, 0, 0, 0.5); 
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            animation: fadeIn 2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Capa del paisaje de fondo -->
    <div id="bg-animado"></div>

    <!-- Script para generar los destellos dorados iniciales -->
    <script>
        for(let i=0; i<40; i++){
            let sparkle = document.createElement("div");
            sparkle.className = "sparkle";
            sparkle.style.left = Math.random() * 100 + "vw";
            sparkle.style.top = Math.random() * 100 + "vh";
            sparkle.style.animationDelay = Math.random() * 2 + "s";
            document.body.appendChild(sparkle);
        }
    </script>

    <div class="container" id="mainContainer">
        <button id="btn1" onclick="pedirContrasena()">Dale click</button>
        <button id="btn2" onclick="mostrarPaisaje()">Ver sorpresa</button>
        
        <div id="mensajeFinal">
            Mi amor, te hice esto con amor, con cariño y para que sepas que pase lo que pasé siempre voy a querer darte algo, aquí estan tus dos flores favoritas... Te amo mi amor
        </div>
    </div>

    <script>
        function pedirContrasena() {
            // Contraseña con la fecha exacta que pediste
            const fechaCorrecta = "26-04-25"; 
            
            let intento = prompt("Contraseña: (Introduce la fecha en la que nos conocimos)");
            
            if (intento === fechaCorrecta) {
                alert("Muy bien mi amor, comprobaste que eras tú. El amor de mi vida...");
                document.getElementById('btn1').style.display = 'none';
                document.getElementById('btn2').style.display = 'inline-block';
            } else {
                alert("Esa no es la fecha mi amor, vuelve a intentarlo.");
            }
        }

        function mostrarPaisaje() {
            // Ocultar botón y quitar fondo blanco del contenedor
            document.getElementById('btn2').style.display = 'none';
            document.getElementById('mainContainer').style.background = 'transparent';
            document.getElementById('mainContainer').style.boxShadow = 'none';
            
            // Activar la animación de "video" del paisaje
            document.body.classList.add('mostrar-paisaje');
            
            // Eliminar los destellos dorados
            let destellos = document.querySelectorAll('.sparkle');
            destellos.forEach(d => d.style.display = 'none');
            
            // Iniciar la animación de los tulipanes y peonías saliendo desde abajo
            iniciarLluviaDeFlores();

            // Mostrar el mensaje final suavemente
            setTimeout(() => {
                document.getElementById('mensajeFinal').style.display = 'block';
            }, 1000); 
        }

        function iniciarLluviaDeFlores() {
            // Usamos emojis que representan peonías y tulipanes
            const flores = ['🌷', '🌸', '🌷', '🌸', '🌺']; 
            
            setInterval(() => {
                let flor = document.createElement("div");
                flor.className = "flor-animada";
                flor.innerText = flores[Math.floor(Math.random() * flores.length)];
                flor.style.left = Math.random() * 95 + "vw";
                // Variar la velocidad de cada flor
                flor.style.animationDuration = (Math.random() * 4 + 5) + "s"; 
                document.body.appendChild(flor);
                
                // Limpiar las flores una vez salgan de la pantalla para no saturar la memoria
                setTimeout(() => flor.remove(), 9000);
            }, 400); // Aparece una nueva flor cada 400 milisegundos
        }
    </script>
</body>
</html>
